<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadratische Funktionen – Transformationen</title>
<style>
:root{
  --bw:min(170px,calc((100vw - 48px) / 7.7));
  --fs:calc(var(--bw) * 0.125);
  --bg:#f5f7fa;--card:#ffffff;--ink:#1d2733;--muted:#5a6676;--line:#d5dce6;--grid:#e3e8ef;--axis:#3b4656;
  --g:#4b5563;--pe:#c2410c;--pa:#6d28d9;--pd:#0f766e;--te:#c2410c;--ta:#6d28d9;--td:#0f766e;--q:#1f5fbf;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141a22;--card:#1e2631;--ink:#eef2f7;--muted:#a9b4c3;--line:#364255;--grid:#2b3545;--axis:#c8d2e0;
  --g:#667085;--te:#ffa670;--ta:#b69cff;--td:#5eead4;--q:#7db0ff;}
}
:root[data-theme="dark"]{--bg:#141a22;--card:#1e2631;--ink:#eef2f7;--muted:#a9b4c3;--line:#364255;--grid:#2b3545;--axis:#c8d2e0;
  --g:#667085;--te:#ffa670;--ta:#b69cff;--td:#5eead4;--q:#7db0ff;}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.4}
header{padding:12px 16px 4px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:1.4rem;font-weight:650}
header .sub{color:var(--muted);font-size:1rem}
main{padding:6px 10px 90px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(20,30,50,.05)}
.card h2{margin:0;font-size:1rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.sep{border:none;border-top:2px solid var(--line);margin:18px 0 14px}
.fn{text-align:center;font-size:clamp(1.05rem,3.4vw,1.7rem);font-weight:600;margin:8px 0 0;min-height:1.5em;font-variant-numeric:tabular-nums}
.ce{color:var(--te)}.ca{color:var(--ta)}.cd{color:var(--td)}.cq{color:var(--q)}
.lbl{font-size:.62em;font-weight:600;color:var(--muted);letter-spacing:.03em;line-height:1.3}
#fnEx{font-size:clamp(.95rem,2.6vw,1.25rem);font-weight:500}

/* Wirkungskette: immer eine Zeile */
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:calc(var(--bw) * .03);padding-top:calc(var(--fs) * 1.8)}
.arr{width:calc(var(--bw) * .2);flex:none;height:auto;color:var(--muted)}
.group{position:relative;border:3px dashed var(--muted);border-radius:calc(var(--fs) * 1.6);padding:calc(var(--bw) * .1);display:flex;align-items:center;flex:none}
.gname{position:absolute;top:calc(var(--fs) * -1.1);left:50%;transform:translateX(-50%);background:var(--card);padding:0 .6em;font-weight:700;font-size:var(--fs);color:var(--muted);white-space:nowrap}
.autos{display:flex;align-items:center;gap:calc(var(--bw) * .03);flex-wrap:nowrap}
.auto{flex:none;width:var(--bw);font-size:var(--fs);color:#fff;border-radius:calc(var(--fs) * 1.1);padding:calc(var(--fs) * .4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;box-shadow:0 4px 12px rgba(20,30,60,.2)}
.auto.gen{height:calc(var(--bw) * 1.35)}
.auto.ex{height:calc(var(--bw) * 1.15);box-shadow:none}
.auto.ex .calc{background:rgba(255,255,255,.94);color:#111;border-top:none;border-radius:calc(var(--fs) * .7);padding:0 .3em;margin-top:calc(var(--fs) * .3)}
.auto.ex .lb{font-size:calc(var(--fs) * .85);font-weight:600;opacity:.9}
.sq{color:#1f5fbf;font-weight:700}
.auto.io{width:calc(var(--bw) * .9)}
.auto.q{width:calc(var(--bw) * 1.15)}
.auto.g{background:var(--g)}
.auto.q{background:#1f5fbf;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.auto.e{background:var(--pe)}.auto.a{background:var(--pa)}.auto.d{background:var(--pd)}
.auto .top{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%}
.auto .nm{font-weight:700;font-size:calc(var(--fs) * 1.08);line-height:1.15;hyphens:auto}
.auto .vb{font-size:calc(var(--fs) * .92);line-height:1.2}
.auto .calc{width:100%;height:calc(var(--fs) * 4.4);display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.5);font-size:calc(var(--fs) * 1.05);font-weight:600;line-height:1.25;overflow:hidden;font-variant-numeric:tabular-nums}
.auto .big{font-size:calc(var(--fs) * 1.6);font-weight:700;font-style:italic}
.auto .val{font-size:calc(var(--fs) * 1.4);font-weight:700;font-variant-numeric:tabular-nums}
.auto input[type=text]{width:80%;font-size:calc(var(--fs) * 1.25);text-align:center;padding:2px 0;margin:3px 0;border:3px solid #fff;border-radius:8px;background:#fff;color:#111;font-variant-numeric:tabular-nums}
.auto input[type=text]:focus{outline:3px solid #93c5fd;outline-offset:1px}
.auto input[type=range]{width:92%;height:calc(var(--fs) * 1.5);accent-color:#fff;margin:0}
.auto button{font:inherit;font-size:calc(var(--fs) * 1.05);font-weight:700;background:#fff;color:#111;border:none;border-radius:8px;padding:2px 16px;margin-top:3px;cursor:pointer}
input.bad{border-color:#b91c1c!important;background:#fde8e8!important;color:#7f1d1d!important}

.params{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.params:empty{margin:0}
.prow{width:100%;max-width:720px;display:flex;align-items:center;gap:10px}
.prow.px .nm{color:var(--ink)}
.xv{width:84px;font-size:1.2rem;text-align:center;padding:6px;border:3px solid var(--g);border-radius:10px;font-variant-numeric:tabular-nums}
.prow .nm{font-size:1.5rem;font-weight:700;font-style:italic;width:1.2em}
.prow.pe .nm{color:var(--te)}.prow.pa .nm{color:var(--ta)}.prow.pd .nm{color:var(--td)}
.prow input[type=text]{width:84px;font-size:1.2rem;text-align:center;padding:6px;border:3px solid;border-radius:10px;background:var(--card);color:var(--ink)}
.prow.pe input[type=text]{border-color:var(--pe)}.prow.pa input[type=text]{border-color:var(--pa)}.prow.pd input[type=text]{border-color:var(--pd)}
.prow.pe input[type=range]{accent-color:var(--pe)}.prow.pa input[type=range]{accent-color:var(--pa)}.prow.pd input[type=range]{accent-color:var(--pd)}
.prow input[type=text]:focus{outline:3px solid var(--q);outline-offset:2px}
.prow input[type=range]{flex:1;min-width:100px;height:34px}
.err{min-height:1.2em;color:#b91c1c;font-size:.95rem;margin-top:6px;text-align:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#ff9d9d}}
svg#g{width:100%;max-width:760px;height:auto;display:block;margin:8px auto 0;border-radius:12px;background:var(--card)}

#tbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#111827;color:#e5e7eb;padding:8px 14px;border-radius:999px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:.94;z-index:10;max-width:96vw}
#tbar[hidden]{display:none}
#tbar button{font:inherit;background:#374151;color:#fff;border:1px solid #4b5563;border-radius:999px;padding:10px 20px;font-size:1rem;cursor:pointer}
#tbar button:hover{background:#4b5563}
#tbar button:focus-visible{outline:3px solid #93c5fd}
#tbar button:disabled{opacity:.4;cursor:default}
#tbar .ind{min-width:140px;text-align:center}
.hide{display:none!important}
@media (max-width:600px){
  :root{--fs:16px}
  header h1{font-size:1.15rem}
  main{padding:6px 6px 90px}
  .card{padding:10px}
  .chain{flex-direction:column;align-items:stretch;gap:0;padding-top:28px}
  .arr{width:28px;height:22px;transform:rotate(90deg);align-self:center;margin:3px 0}
  .group{flex-direction:column;align-items:stretch;padding:22px 10px 10px}
  .autos{flex-direction:column;align-items:stretch;gap:0}
  .auto,.auto.io,.auto.q{width:100%}
  .auto.gen{height:calc(var(--fs) * 6)}
  .auto.ex{height:calc(var(--fs) * 6)}
  .auto.io.ex{height:calc(var(--fs) * 8.2)}
  .auto .calc{height:calc(var(--fs) * 2.8)}
  .auto input[type=text]{width:46%}
  .auto input[type=range]{width:96%}
  .prow{max-width:none;flex-wrap:wrap}
  .prow input[type=range]{flex:1 1 100%;order:3;min-width:0}
  #tbar{gap:6px;padding:6px 10px}
  #tbar .ind{min-width:0;font-size:.8rem}
  #tbar button{padding:9px 14px}
}
</style>
</head>
<body>
<header>
  <h1>Quadratische Funktionen – Transformationen</h1>
</header>

<main>
  <section class="card" aria-label="Automaten">
    <div id="genBlock">
      <h2>Allgemeiner Automat</h2>
      <div class="fn" id="fnGen"></div>
      <div class="chain">
        <div class="auto g io gen"><div class="nm">Eingabe</div><div class="big">x</div></div>
        <svg class="arr" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 12H24M17 4L26 12L17 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="group"><div class="gname hide" id="gnameGen">Parabelautomat</div><div class="autos" id="autosGen"></div></div>
        <svg class="arr" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 12H24M17 4L26 12L17 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="auto g io gen"><div class="nm">Ausgabe</div><div class="big">f(x)</div></div>
      </div>
      <hr class="sep">
    </div>

    <div id="exBlock">
      <h2 id="exH">Beispiel</h2>
      <div class="fn" id="fnEx"></div>
      <div class="chain">
        <div class="auto g io ex">
          <label class="nm lb" for="xIn">x</label>
          <input id="xIn" type="text" inputmode="decimal" autocomplete="off" aria-describedby="err">
          <button id="xOk" type="button" class="hide">OK</button>
        </div>
        <svg class="arr" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 12H24M17 4L26 12L17 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="group"><div class="gname hide" id="gnameEx">Parabelautomat</div><div class="autos" id="autosEx"></div></div>
        <svg class="arr" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 12H24M17 4L26 12L17 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="auto g io ex"><div class="nm lb">f(x)</div><div class="val" id="yOut" aria-live="polite">–</div></div>
      </div>
      <div class="params" id="params"></div>
      <div class="err" id="err" role="status"></div>
    </div>
  </section>

  <section class="card" aria-labelledby="gh">
    <h2 id="gh">Graph</h2>
    <svg id="g" viewBox="0 0 700 580" role="img" aria-label="Koordinatensystem mit dem Graphen der Funktion"></svg>
  </section>
</main>

<div id="tbar" role="toolbar" aria-label="Abschnittsnavigation">
  <button id="prev" type="button">◀ Zurück</button>
  <span class="ind" id="ind" aria-live="polite"></span>
  <button id="next" type="button">Weiter ▶</button>
</div>

<script>
(function(){
"use strict";

var NS="http://www.w3.org/2000/svg";
var SECTIONS=[
 {title:"Black Box",ops:["?"]},
 {title:"Normalparabel",ops:["q"]},
 {title:"Streckung / Stauchung",ops:["q","a"]},
 {title:"Spiegelung an der x-Achse",ops:["q","a"],neg:true},
 {title:"Verschiebung in x-Richtung",ops:["e","q"]},
 {title:"Verschiebung in y-Richtung",ops:["q","d"]},
 {title:"Scheitelpunktform",ops:["e","q","a","d"],neg:true}
];
var STEP={a:0.1,e:0.5,d:0.5};
var idx=0,S={x:2,a:1,e:0,d:0};
var ARROW='<svg class="arr" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 12H24M17 4L26 12L17 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SQ='<span class="sq">²</span>';
var VERB_GEN={q:"quadriere die Zahl",e:"subtrahiere e",a:"multipliziere mit a",d:"addiere d"};

function $(i){return document.getElementById(i)}
function el(n,attrs,txt){var e=document.createElementNS(NS,n);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e}
function r1(v){return Math.round(v*10)/10}
function fmt(v){var r=r1(v);if(Object.is(r,-0))r=0;return String(r).replace(".",",").replace("-","\u2212")}
function fmtP(v){return r1(v)<0?"("+fmt(v)+")":fmt(v)}
function fmt2(v){var r=Math.round(v*100)/100;if(Object.is(r,-0))r=0;return r.toFixed(2).replace(".",",").replace("-","\u2212")}
function xlim(){return idx<=1?[-3.5,3.5]:[-6,6]}
function parse(s){
  s=String(s).trim().replace(/\u2212/g,"-").replace(",",".");
  if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return NaN;
  return parseFloat(s);
}
function has(p){return SECTIONS[idx].ops.indexOf(p)>=0}
function plist(){return ["e","a","d"].filter(has)}
function range(p){
  if(p==="a")return SECTIONS[idx].neg?[-5,5]:[0.1,5];
  return [-6,6];
}
function f(x){
  var u=has("e")?x-S.e:x,v=u*u;
  if(has("a"))v*=S.a;
  if(has("d"))v+=S.d;
  return v;
}
function vertex(){return [has("e")?S.e:0,has("d")?S.d:0]}
function nameOf(op,general){
  if(op==="q")return "Quadrierer";
  if(op==="e")return "x-Verschieber";
  if(op==="d")return "y-Verschieber";
  if(idx===3)return "Spiegler";
  if(general)return idx===6?"Strecker / Staucher / Spiegler":"Strecker / Staucher";
  if(idx===6&&S.a<0)return "Spiegler";
  return S.a>=1?"Strecker":"Staucher";
}

/* Graph */
var VIEW={xmin:-10,xmax:10,ymin:-8,ymax:8},W=700,H=580,PAD=40;
function X(x){return PAD+(x-VIEW.xmin)/(VIEW.xmax-VIEW.xmin)*(W-2*PAD)}
function Y(y){return H-PAD-(y-VIEW.ymin)/(VIEW.ymax-VIEW.ymin)*(H-2*PAD)}
function curve(fn){
  var d="",n=300;
  for(var i=0;i<=n;i++){
    var x=VIEW.xmin+(VIEW.xmax-VIEW.xmin)*i/n,y=Math.max(VIEW.ymin-4,Math.min(VIEW.ymax+4,fn(x)));
    d+=(i===0?"M":"L")+X(x).toFixed(1)+" "+Y(y).toFixed(1);
  }
  return d;
}
function drawGraph(){
  var g=$("g");while(g.firstChild)g.removeChild(g.firstChild);
  var bb=idx===0,i;
  for(i=VIEW.xmin;i<=VIEW.xmax;i++){
    if(i!==0)g.appendChild(el("line",{x1:X(i),y1:Y(VIEW.ymin),x2:X(i),y2:Y(VIEW.ymax),stroke:"var(--grid)","stroke-width":1}));
  }
  for(i=VIEW.ymin;i<=VIEW.ymax;i++){
    if(i!==0)g.appendChild(el("line",{x1:X(VIEW.xmin),y1:Y(i),x2:X(VIEW.xmax),y2:Y(i),stroke:"var(--grid)","stroke-width":1}));
  }
  g.appendChild(el("line",{x1:X(VIEW.xmin),y1:Y(0),x2:X(VIEW.xmax)+8,y2:Y(0),stroke:"var(--axis)","stroke-width":2}));
  g.appendChild(el("line",{x1:X(0),y1:Y(VIEW.ymin),x2:X(0),y2:Y(VIEW.ymax)-8,stroke:"var(--axis)","stroke-width":2}));
  g.appendChild(el("path",{d:"M"+(X(VIEW.xmax)+12)+" "+Y(0)+"l-9 -4.5l0 9z",fill:"var(--axis)"}));
  g.appendChild(el("path",{d:"M"+X(0)+" "+(Y(VIEW.ymax)-12)+"l-4.5 9l9 0z",fill:"var(--axis)"}));
  for(i=VIEW.xmin;i<=VIEW.xmax;i+=2){
    if(i!==0)g.appendChild(el("text",{x:X(i),y:Y(0)+18,"text-anchor":"middle","font-size":13,fill:"var(--muted)"},fmt(i)));
  }
  for(i=VIEW.ymin;i<=VIEW.ymax;i+=2){
    if(i!==0)g.appendChild(el("text",{x:X(0)-8,y:Y(i)+4,"text-anchor":"end","font-size":13,fill:"var(--muted)"},fmt(i)));
  }
  g.appendChild(el("text",{x:W-6,y:Y(0)-10,"text-anchor":"end","font-size":15,"font-style":"italic",fill:"var(--axis)"},"x"));
  g.appendChild(el("text",{x:X(0)+12,y:18,"font-size":15,"font-style":"italic",fill:"var(--axis)"},"f(x)"));
  var defs=el("defs",{}),cp=el("clipPath",{id:"clip"});
  cp.appendChild(el("rect",{x:X(VIEW.xmin),y:Y(VIEW.ymax),width:X(VIEW.xmax)-X(VIEW.xmin),height:Y(VIEW.ymin)-Y(VIEW.ymax)}));
  defs.appendChild(cp);g.appendChild(defs);
  var gg=el("g",{"clip-path":"url(#clip)"});g.appendChild(gg);
  var v=vertex();
  if(idx>=2){
    gg.appendChild(el("path",{d:curve(function(x){return x*x}),fill:"none",stroke:"var(--muted)","stroke-width":2.5,"stroke-dasharray":"7 6",opacity:.7}));
  }
  if(!bb){
    gg.appendChild(el("line",{x1:X(v[0]),y1:Y(VIEW.ymin),x2:X(v[0]),y2:Y(VIEW.ymax),stroke:"var(--muted)","stroke-width":1.5,"stroke-dasharray":"3 5"}));
    gg.appendChild(el("path",{d:curve(f),fill:"none",stroke:"var(--q)","stroke-width":4,"stroke-linecap":"round","stroke-linejoin":"round"}));
  }
  (bb?S.pts:[S.x]).forEach(function(px){
    var py=f(px);
    if(!bb||px===S.x){
      gg.appendChild(el("line",{x1:X(px),y1:Y(0),x2:X(px),y2:Y(py),stroke:"var(--muted)","stroke-width":1.5,"stroke-dasharray":"4 4"}));
      gg.appendChild(el("line",{x1:X(0),y1:Y(py),x2:X(px),y2:Y(py),stroke:"var(--muted)","stroke-width":1.5,"stroke-dasharray":"4 4"}));
    }
    gg.appendChild(el("circle",{cx:X(px),cy:Y(py),r:7,fill:"var(--g)",stroke:"var(--card)","stroke-width":2}));
  });
  if(!bb){
    g.appendChild(el("circle",{cx:X(v[0]),cy:Y(v[1]),r:8,fill:"var(--card)",stroke:"var(--ink)","stroke-width":4}));
    var lx=X(v[0])+14,anchor="start";
    if(lx>W-120){lx=X(v[0])-14;anchor="end"}
    var ly=Y(v[1])+((has("a")&&S.a<0)?-14:30);
    if(ly>H-12)ly=Y(v[1])-14;
    var tx=el("text",{x:lx,y:ly,"text-anchor":anchor,"font-size":17,"font-weight":700,fill:"var(--ink)","paint-order":"stroke",stroke:"var(--card)","stroke-width":5});
    tx.appendChild(el("tspan",{},"S("));tx.appendChild(el("tspan",{fill:"var(--te)"},fmt(v[0])));
    tx.appendChild(el("tspan",{},"|"));tx.appendChild(el("tspan",{fill:"var(--td)"},fmt(v[1])));
    tx.appendChild(el("tspan",{},")"));g.appendChild(tx);
  }
}

/* Automaten */
function autoBox(cls,mode,name,verbal,calc){
  return '<div class="auto '+cls+' '+mode+'"><div class="top">'+(mode==="ex"?"":'<div class="nm">'+name+'</div>')+(verbal?'<div class="vb">'+verbal+'</div>':'')+'</div>'+(mode==="ex"?'<div class="calc">'+(calc||"")+'</div>':'')+'</div>';
}
function renderAutos(){
  var ops=SECTIONS[idx].ops;
  $("autosGen").innerHTML=ops.map(function(op){
    return autoBox(op,"gen",nameOf(op,true),VERB_GEN[op],"");
  }).join(ARROW);
  var ex=fmt(S.x);
  $("autosEx").innerHTML=ops.map(function(op){
    if(op==="?")return autoBox("q","ex","","","?");
    var verbal;
    if(op==="q"){ex=has("e")?"("+ex+")"+SQ:fmtP(S.x)+SQ;verbal=VERB_GEN.q}
    else if(op==="e"){ex=fmt(S.x)+" − "+fmtP(S.e);verbal="subtrahiere "+fmtP(S.e)}
    else if(op==="a"){ex=ex+" · "+fmtP(S.a);verbal="multipliziere mit "+fmtP(S.a)}
    else{ex=ex+" + "+fmtP(S.d);verbal="addiere "+fmtP(S.d)}
    return autoBox(op,"ex",nameOf(op,false),verbal,ex);
  }).join(ARROW);
  var lab=idx===6;
  $("gnameGen").classList.toggle("hide",!lab);
  $("gnameEx").classList.toggle("hide",!lab);
}
function sp(c,t){return '<span class="'+c+'">'+t+'</span>'}
function renderEquations(){
  var e=has("e")?"(x − "+sp("ce","e")+")"+sp("cq","²"):"x"+sp("cq","²");
  if(has("a"))e=sp("ca","a")+" · "+e;
  if(has("d"))e+=" + "+sp("cd","d");
  $("fnGen").innerHTML=(idx===6?'<div class="lbl">Scheitelpunktform</div>':"")+"f(x) = "+e;
  var x=has("e")?"(x "+(S.e<0?"+ "+sp("ce",fmt(-S.e)):"− "+sp("ce",fmt(S.e)))+")"+sp("cq","²"):"x"+sp("cq","²");
  if(has("a"))x=sp("ca",fmt(S.a))+" · "+x;
  if(has("d"))x+=(S.d<0?" − "+sp("cd",fmt(-S.d)):" + "+sp("cd",fmt(S.d)));
  $("fnEx").innerHTML="f(x) = "+x;
}

/* Parameter-Eingaben */
function buildParams(){
  var box=$("params");box.innerHTML="";
  if(idx>=1){
    var xr=xlim(),xrow=document.createElement("div");xrow.className="prow px";
    xrow.innerHTML='<span class="nm">x</span><span class="xv" id="xv"></span><input type="range" id="r_x" min="'+xr[0]+'" max="'+xr[1]+'" step="0.1" aria-label="Eingabe x per Schieberegler">';
    box.appendChild(xrow);
    xrow.querySelector("#r_x").addEventListener("input",function(e){S.x=r1(parseFloat(e.target.value));$("xIn").classList.remove("bad");$("err").textContent="";update()});
  }
  plist().forEach(function(p){
    var r=range(p);
    var row=document.createElement("div");row.className="prow p"+p;
    row.innerHTML='<span class="nm">'+p+'</span><input type="text" inputmode="decimal" autocomplete="off" id="p_'+p+'" aria-label="Parameter '+p+'"><input type="range" id="r_'+p+'" min="'+r[0]+'" max="'+r[1]+'" step="'+STEP[p]+'" aria-label="Parameter '+p+' per Schieberegler">';
    box.appendChild(row);
    var t=row.querySelector("#p_"+p),rg=row.querySelector("#r_"+p);
    rg.addEventListener("input",function(){
      var v=r1(parseFloat(rg.value));
      if(p==="a"&&Math.abs(v)<0.05)v=S.a>0?-0.1:0.1;
      S[p]=v;
      t.classList.remove("bad");$("err").textContent="";update();
    });
    t.addEventListener("input",function(){commitText(t,p)});
    t.addEventListener("blur",function(){t.classList.remove("bad");$("err").textContent="";syncInputs()});
  });
}
function commitText(inp,key){
  var raw=inp.value.trim();
  if(raw===""||raw==="-"||raw==="\u2212"){inp.classList.remove("bad");return}
  var v=parse(raw),r=key==="x"?xlim():range(key);
  if(isNaN(v)){inp.classList.add("bad");$("err").textContent="Bitte eine Zahl eingeben (z. B. 2,5).";return}
  v=r1(v);
  if(key==="a"&&v===0){inp.classList.add("bad");$("err").textContent="a darf nicht 0 sein.";return}
  if(v<r[0]||v>r[1]){inp.classList.add("bad");$("err").textContent="Zulässiger Bereich für "+key+": "+fmt(r[0])+" bis "+fmt(r[1])+".";return}
  inp.classList.remove("bad");$("err").textContent="";
  S[key]=v;update(key);
}
function syncInputs(skip){
  if(skip!=="x"&&idx!==0&&document.activeElement!==$("xIn"))$("xIn").value=fmt(S.x);
  var rx=$("r_x");if(rx)rx.value=S.x;var xv=$("xv");if(xv)xv.textContent=fmt(S.x);
  plist().forEach(function(p){
    var t=$("p_"+p),rg=$("r_"+p);
    if(t&&p!==skip&&document.activeElement!==t)t.value=fmt(S[p]);
    if(rg)rg.value=S[p];
  });
}
function update(skip){
  $("yOut").textContent=idx===0?(S.has?fmt2(f(S.x)):"–"):fmt(f(S.x));
  renderAutos();renderEquations();drawGraph();syncInputs(skip);
}
function show(i){
  idx=Math.max(0,Math.min(SECTIONS.length-1,i));
  S={x:2,a:1,e:0,d:0,pts:[],has:idx!==0};
  var low=(idx===3||idx>=5);VIEW.ymin=low?-8:-2;VIEW.ymax=low?8:14;
  $("xOk").classList.toggle("hide",idx!==0);
  if(idx===0)$("xIn").value="";
  $("tbar").classList.toggle("hide",idx===0);
  $("next").classList.toggle("hide",idx===5);
  $("ind").textContent="Abschnitt "+(idx+1)+" von "+SECTIONS.length+" · "+SECTIONS[idx].title;
  $("prev").disabled=idx===0;$("next").disabled=idx===SECTIONS.length-1;
  $("genBlock").classList.toggle("hide",idx===0);
  $("fnEx").classList.toggle("hide",idx===0);
  $("exH").textContent=idx===0?"Automat":"Beispiel";
  $("err").textContent="";$("xIn").classList.remove("bad");
  buildParams();update();
}

function commitBB(){
  var raw=$("xIn").value.trim(),r=xlim();
  if(raw==="")return;
  var v=parse(raw);
  if(isNaN(v)){$("xIn").classList.add("bad");$("err").textContent="Bitte eine Zahl eingeben (z. B. 1,5).";return}
  v=r1(v);
  if(v<r[0]||v>r[1]){$("xIn").classList.add("bad");$("err").textContent="Zulässiger Bereich: "+fmt(r[0])+" bis "+fmt(r[1])+".";return}
  $("xIn").classList.remove("bad");$("err").textContent="";
  S.x=v;S.has=true;if(S.pts.indexOf(v)<0)S.pts.push(v);
  $("xIn").value=fmt(v);update("x");
}
$("xIn").addEventListener("input",function(){
  if(idx===0){$("xIn").classList.remove("bad");$("err").textContent="";return}
  commitText($("xIn"),"x");
});
$("xIn").addEventListener("keydown",function(e){if(idx===0&&e.key==="Enter"){e.preventDefault();commitBB()}});
$("xIn").addEventListener("focus",function(){if(idx===0)$("xIn").select()});
$("xOk").addEventListener("click",commitBB);
$("xIn").addEventListener("blur",function(){$("xIn").classList.remove("bad");$("err").textContent="";if(idx!==0)syncInputs()});

function go(d,gate){
  if(d>0&&(idx===0||idx===5)&&!gate)return;
  var n=Math.max(0,Math.min(SECTIONS.length-1,idx+d));
  if(n!==idx)show(n);
}
$("prev").addEventListener("click",function(){go(-1)});
$("next").addEventListener("click",function(){go(1)});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(t.tagName&&t.tagName.toLowerCase()==="input")return;
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
});
var lastTap=0;
document.addEventListener("pointerup",function(e){
  var q=e.target.closest?e.target.closest(".auto.q"):null;
  if(!q)return;
  var now=Date.now();
  if(now-lastTap<450){lastTap=0;if(idx===0||idx===5)go(1,true)}else lastTap=now;
});
show(0);
})();
</script>
</body>
</html>
